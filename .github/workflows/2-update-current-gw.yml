name: "2 - Update Current Gameweek Live Data"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-current-gw:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Packages
        run: |
          npm install firebase-admin axios

      - name: Update Active GW Matches
        env:
          FIREBASE_SERVICE_ACCOUNT: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TW_TEAM_FANTASY }}"
        run: |
          node scripts/updateCurrentGW.js
