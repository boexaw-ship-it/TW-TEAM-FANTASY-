name: Seed 380 Fixtures to Firebase Firestore

on:
  workflow_dispatch: # GitHub Action tab ကနေ "Run workflow" ခလုတ်နှိပ်ပြီး ကိုယ်တိုင် အချိန်မရွေး မောင်းနှင်နိုင်သည်

jobs:
  seed-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase SDK
        run: |
          npm init -y
          npm pkg set type="module"
          npm install firebase

      - name: Run 380 Fixtures Seeding Script
        run: node scripts/seed380Fixtures.js
