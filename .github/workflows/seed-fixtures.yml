name: Seed 380 Fixtures to Firebase Firestore

on:
  workflow_dispatch:

jobs:
  seed-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase SDK
        run: |
          npm init -y
          npm pkg set type="module"
          npm install firebase firebase-admin

      - name: Run 380 Fixtures Seeding Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TW_TEAM_FANTASY }}
        run: node scripts/seed380Fixtures.js
