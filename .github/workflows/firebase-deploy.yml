name: Deploy TW Team Fantasy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy_to_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TW_TEAM_FANTASY }}'
          channelId: live
          projectId: tw-team-fantasy
