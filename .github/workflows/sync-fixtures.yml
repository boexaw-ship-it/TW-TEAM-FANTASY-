name: TW Fantasy Fixtures & GW Auto Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-fpl-to-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Required Packages
        run: |
          npm install firebase-admin axios firebase

      - name: 🚀 Step 1: Sync Official FPL Fixtures to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TW_TEAM_FANTASY }}
        run: |
          node scripts/syncFixtures.js

      - name: 📊 Step 2: Calculate Contestant Scores
        run: |
          node scripts/calculateUserScores.js
