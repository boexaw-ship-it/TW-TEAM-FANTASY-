name: TW Fantasy Fixtures & GW Auto Sync

on:
  # ၁။ မိနစ် ၃၀ တိုင်း အလိုအလျောက် ပွဲရလဒ်နှင့် အမှတ်များ Sync ပြုလုပ်ခြင်း
  schedule:
    - cron: '*/30 * * * *'
  
  # ၂။ GitHub Actions Tab မှ "Run workflow" ခလုတ်နှိပ်၍ လက်ဖြင့် စမ်းသပ်နိုင်ရန်
  workflow_dispatch:

jobs:
  sync-fpl-to-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Required Packages
        run: |
          npm install firebase-admin axios

      - name: 🚀 Run Fixtures & Gameweek Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TW_TEAM_FANTASY }}
        run: |
          node scripts/syncFixtures.js
